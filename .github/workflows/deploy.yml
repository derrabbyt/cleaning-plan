name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Restricted cleaning_app connection string; it is embedded in the public bundle.
      - run: npm run build -- --base-href /cleaning-plan/
        env:
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cleaning-plan/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
